<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europe</title>
<!-- Placeholder until the real Europe VJ is built. -->
<script src="../vj-bridge.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: #04060d; color: #e8ecf6;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .glow {
    position: fixed; inset: -25%;
    background:
      radial-gradient(38% 34% at 32% 42%, rgba(46, 86, 210, 0.55), transparent 70%),
      radial-gradient(30% 28% at 68% 60%, rgba(255, 200, 60, 0.2), transparent 70%);
    filter: blur(30px);
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-5%, -3%) rotate(0deg); }
    to { transform: translate(5%, 4%) rotate(10deg); }
  }
  main { position: relative; padding: 0 16px; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(42px, 11vw, 132px); font-weight: 200;
    letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
  }
  p {
    margin: 16px 0 0;
    font-size: 12px; letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase;
    color: rgba(232, 236, 246, 0.5);
  }
  @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <h1>Europe</h1>
  <p>VJ coming soon</p>
</main>
</body>
</html>
